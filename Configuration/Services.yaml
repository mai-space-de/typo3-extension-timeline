services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiTimeline\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  Maispace\MaiTimeline\Indexer\TimelineIndexer:
    tags:
      - name: 'maispace.search.indexer'
      - name: 'maispace.search.result_formatter'

  dashboard.widget.maiTimelineManual:
    class: 'ProudNerds\PnBackendManual\Widgets\ManualWidget'
    arguments:
      $options:
        file: 'EXT:mai_timeline/Resources/Private/Manual/Manual.md'
        numbered: true
        contentsDepth: 2
        printButton: true
    tags:
      - name: dashboard.widget
        identifier: 'maiTimelineManual'
        groupNames: 'documentation'
        title: 'Handbuch: Zeitstrahl'
        description: 'Kurze Anleitung für Einträge auf dem Zeitstrahl.'
        iconIdentifier: 'content-book'
        height: 'medium'
        width: 'medium'
